name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # typecheck + eslint. Until v2.0.3 this step was only `tsc --noEmit`.
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      # The public demo builds the engine into the browser with no backend. It's
      # the only thing that proves the engine is still I/O-free end to end, so
      # build it here -- a server-only import would otherwise surface for the
      # first time during a manual deploy.
      - run: npm run build:demo

  # The images are built from a hand-picked list of COPY lines, so a new
  # workspace package breaks them without breaking anything above: adding
  # packages/graph stopped the Docker path building, unnoticed, until v3.0.2.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/server/Dockerfile -t preflight-server .
      - run: docker build -f apps/web/Dockerfile -t preflight-web .
